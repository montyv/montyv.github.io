image: node:22-bookworm

stages:
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "npm-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get update
    - apt-get install -y git
    - |
      if [ -n "$ENVITRACEJS_REPO_READ_TOKEN" ]; then
        export ENVITRACEJS_REPO_URL="https://x-access-token:${ENVITRACEJS_REPO_READ_TOKEN}@github.com/EnviTrace/EnviTraceJS.git"
      else
        export ENVITRACEJS_REPO_URL="https://github.com/EnviTrace/EnviTraceJS.git"
      fi
    - |
      if git clone --depth 1 --filter=blob:none --sparse "$ENVITRACEJS_REPO_URL" EnviTraceJS; then
        cd EnviTraceJS
        git sparse-checkout set --no-cone "data/monty publications.json" "data/monty presentations.json" "data/monty reports.json"
        cd "$CI_PROJECT_DIR"
      else
        echo "Shared EnviTraceJS catalog checkout unavailable in GitLab CI; continuing without shared Monty JSON source."
      fi
  script:
    - npm ci --prefer-offline
    - |
      if [ -d "$CI_PROJECT_DIR/EnviTraceJS/data" ]; then
        SITE_URL="${SITE_URL:-https://monty.gitlab.io}" MONTY_CATALOG_DATA_DIR="$CI_PROJECT_DIR/EnviTraceJS/data" npm run build
      else
        SITE_URL="${SITE_URL:-https://monty.gitlab.io}" npm run build
      fi
    - test -f out/index.html || test -f out/index/index.html
    - touch out/.nojekyll
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
