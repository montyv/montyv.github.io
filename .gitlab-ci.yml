image: node:22-bookworm

stages:
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "npm-${CI_COMMIT_REF_SLUG}"
  paths:
    - .npm/

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci --prefer-offline
    - 'SITE_URL="${SITE_URL:-https://monty.gitlab.io}" npm run build'
    - test -f out/index.html || test -f out/index/index.html
    - touch out/.nojekyll
    - find out -type f \( -iname '*.pdf' \) -delete
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
