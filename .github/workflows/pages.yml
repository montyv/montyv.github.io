name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout shared EnviTraceJS catalog data
        id: checkout_envitrace
        continue-on-error: true
        uses: actions/checkout@v4
        env:
          ENVITRACEJS_REPO_READ_TOKEN: ${{ secrets.ENVITRACEJS_REPO_READ_TOKEN }}
        with:
          repository: EnviTrace/EnviTraceJS
          ref: main
          path: EnviTraceJS
          sparse-checkout: |
            data/monty publications.json
            data/monty presentations.json
            data/monty reports.json
          sparse-checkout-cone-mode: false
          token: ${{ env.ENVITRACEJS_REPO_READ_TOKEN != '' && env.ENVITRACEJS_REPO_READ_TOKEN || github.token }}

      - name: Warn when shared EnviTraceJS catalog data is unavailable
        if: steps.checkout_envitrace.outcome == 'failure'
        run: echo "Shared EnviTraceJS catalog checkout was not available in CI; continuing without the shared Monty JSON source."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build + export
        run: npm run build
        env:
          SITE_URL: https://montyv.github.io
          MONTY_CATALOG_DATA_DIR: ${{ github.workspace }}/EnviTraceJS/data

      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - name: List output (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "out/ top-level:"
          ls -la out || true
          echo "index.html candidates:"
          find out -maxdepth 3 -type f -name 'index.html' -print || true

      - name: Verify output
        run: test -f out/index.html || test -f out/index/index.html

      - name: List output before upload (debug)
        run: |
          echo "Final out/ contents before artifact upload:"
          ls -la out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
